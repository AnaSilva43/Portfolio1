<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@300;400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Cascadia Mono", sans-serif;
            background-image: url('imagens/capa.png');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
            overflow: hidden;
        }

        /* Barra de Navegação */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        /* Ícone do Instagram */
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 22px;
            transition: 0.3s;
            display: inline-block;
        }

        .nav-links a:hover {
            opacity: 0.5;
            transform: translateY(-2px);
        }

        /* Menu Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        .dropbtn:hover {
            opacity: 0.5;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #1a1a1a;
            min-width: 160px;
            border-radius: 8px;
            box-shadow: 0px 8px 16px rgba(255,255,255,0.05);
            z-index: 10;
        }

        .dropdown-content a {
            color: #ffffff;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
            font-size: 14px;
        }

        .dropdown-content a:hover {
            background-color: #333333;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Conteúdo Principal */
        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: flex-end;
            text-align: left;
            padding-bottom: 40px;
        }

        /* Nome em duas linhas com animação */
        .main-title {
            display: flex;
            flex-direction: column;
        }

        .main-title span {
            font-family: "Playfair Display", serif;
            font-size: 75px;
            line-height: 1.1;
            color: #ffffff;
            font-weight: 700;
            display: block;
            overflow: hidden;
            white-space: nowrap;
            width: 0;
        }

        .line1 {
            border-right: 3px solid #ffffff;
            animation: typing 1s steps(4, end) forwards, 
                       blink-cursor 0.5s step-end infinite,
                       no-border 0s linear forwards 1s;
        }

        .line2 {
            border-right: 3px solid transparent;
            animation: typing 1.2s steps(5, end) forwards 1s, 
                       blink-cursor 0.5s step-end infinite 1s,
                       no-border 0s linear forwards 2.2s;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 280px; }
        }

        @keyframes blink-cursor {
            from, to { border-color: transparent; }
            50% { border-color: #ffffff; }
        }

        @keyframes no-border {
            to { border-right: 3px solid transparent; }
        }

        /* Lado Direito: A tua introdução correta */
        .intro {
            max-width: 450px;
            padding-bottom: 15px;
            animation: fadeIn 1.5s ease-in-out forwards;
            opacity: 0;
            animation-delay: 2.2s;
        }

        .intro p {
            font-size: 15px;
            line-height: 1.7;
            color: #ffffff;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            body {
                padding: 20px;
                overflow: auto;
            }
            .content {
                grid-template-columns: 1fr;
                gap: 50px;
                align-items: center;
                margin-top: 60px;
            }
            .main-title span {
                font-size: 55px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">AS</div>
        
        <div class="nav-container">
            <div class="nav-links">
                <a href="https://www.instagram.com/mangle8510/" target="_blank" aria-label="Instagram">
                    <i class="fa fa-instagram"></i>
                </a>
            </div>
            
            <div class="dropdown">
                <button class="dropbtn" aria-label="Menu"><i class="fa fa-navicon"></i></button>
                <div class="dropdown-content">
                    <a href="cv.html" target="_blank">CV</a>
                    <a href="trabalhos.html" target="_blank">Projetos</a>
                </div>
            </div>
        </div>
    </div>

    <main class="content">
        <div class="main-title">
            <span class="line1">Ana</span>
            <span class="line2">Silva</span>
        </div>
        
        <section class="intro">
            <p>Estudante de Design de Comunicação. Seja bem-vindo ao meu espaço digital, onde partilho projetos focados em identidade visual, e soluções criativas.</p>
        </section>
    </main>

</body>
</html>
